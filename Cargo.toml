[package]
name = "genesis"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12.4", default-features = false, features = [
    "client",
    "gateway",
    "rustls_backend",
    "model",
] }
poise = "0.6.1"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }
dotenv = "0.15"
rand = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
ureq = { version = "2.10", features = ["json"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"], optional = true }

[features]
database = ["sqlx"]
