services:
    genesis:
        container_name: atums-genesis
        image: genesis:latest
        build:
            context: .
        restart: unless-stopped
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - atums-genesis-network

    postgres:
        image: postgres:16
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: genesis
            PGUSER: postgres
        volumes:
            - ./postgres-data:/var/lib/postgresql/data
        networks:
            - atums-genesis-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

networks:
    atums-genesis-network:
        driver: bridge
